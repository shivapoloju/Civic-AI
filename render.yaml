services:
  # Express Backend Gateway Service
  - type: web
    name: civicai-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: postgres://postgres:password123@postgres:5432/civicai  # Switch to hosted Postgres URL in production
      - key: MONGODB_URI
        value: mongodb://localhost:27017/civicai                      # Switch to hosted MongoDB URL in production
      - key: AI_SERVICE_URL
        value: https://civicai-ai-service.onrender.com                # Replace with actual Render URL of AI service

  # FastAPI Python AI Service
  - type: web
    name: civicai-ai-service
    env: python
    rootDir: ai_service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: PORT
        value: 8000
      - key: HOST
        value: 0.0.0.0
      - key: GROQ_API_KEY
        sync: false
