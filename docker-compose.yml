version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: civicai-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: civicai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    volumes:
      - pgdata:/var/lib/postgresql/data

  mongodb:
    image: mongo:6-jammy
    container_name: civicai-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

  backend:
    build:
      context: ./backend
    container_name: civicai-express-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgres://postgres:password123@postgres:5432/civicai
      - MONGODB_URI=mongodb://mongodb:27017/civicai
      - JWT_SECRET=civicai-super-secret-key-12345
      - AI_SERVICE_URL=http://ai_service:8000
    depends_on:
      - postgres
      - mongodb
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules

  ai_service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: civicai-fastapi-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - XAI_API_KEY=${XAI_API_KEY}
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
    container_name: civicai-react-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - backend

volumes:
  pgdata:
  mongodata:
